services:
  - type: worker
    name: usd-jpy-signal-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: ACCOUNT_BALANCE
        value: "10000"
      - key: RISK_PER_TRADE
        value: "0.01"
      - key: DAILY_MAX_LOSS
        value: "0.03"
      - key: MAX_CONCURRENT_TRADES
        value: "3"
      - key: ZAI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
